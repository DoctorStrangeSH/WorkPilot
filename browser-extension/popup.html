<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malenia Browser Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">M</div>
      <div>
        <strong>Malenia</strong>
        <span>Browser Bridge</span>
      </div>
    </header>
    <div id="status" class="status" role="status" aria-live="polite">Проверяем соединение…</div>
    <button id="share" type="button" disabled>Поделиться вкладкой</button>
    <button id="inspect" class="secondary" type="button" disabled>Прочитать страницу</button>
    <button id="retry" class="secondary" type="button" disabled>Повторить подключение</button>
    <p class="privacy">«Поделиться вкладкой» передаёт только заголовок и адрес без параметров. «Прочитать страницу» отдельно передаёт до 16 000 символов видимого текста локальному хосту без сохранения. Поля форм, cookies и пароли не запрашиваются.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
