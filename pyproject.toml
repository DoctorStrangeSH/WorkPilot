[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malenia-agent"
version = "0.2.0"
description = "Local-first Malenia agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Malenia contributors" }]
dependencies = []

[project.scripts]
malenia-agent = "malenia.cli:main"

[tool.setuptools]
package-dir = {"" = "agent"}

[tool.setuptools.packages.find]
where = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
