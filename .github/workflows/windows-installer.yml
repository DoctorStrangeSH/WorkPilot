name: Windows installer

on:
  push:
    branches: ["feat/desktop-shell"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Package local Python agent
        run: >-
          python -m PyInstaller --clean --onedir
          --name workpilot-agent
          --distpath desktop/src-tauri/resources
          --workpath "$env:RUNNER_TEMP/workpilot-pyinstaller"
          --paths agent
          packaging/workpilot_agent_entry.py

      - name: Verify bundled agent
        shell: pwsh
        run: |
          $agent = "desktop/src-tauri/resources/workpilot-agent/workpilot-agent.exe"
          if (!(Test-Path $agent)) { throw "Bundled Python agent was not produced." }
          $size = (Get-Item $agent).Length
          if ($size -lt 1000000) { throw "Bundled agent looks unexpectedly small ($size bytes)." }
          Write-Host "Bundled agent size: $size bytes"
          & $agent --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Bundled agent smoke test failed." }

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run tauri -- build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: workpilot-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
